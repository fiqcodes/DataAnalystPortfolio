ight="49.276250000000005" fill="#17784e"/><rect x="439" y="247.70075" width="24" height="44.29925" fill="#17784e"/><rect x="473" y="223.56625" width="24" height="68.43375" fill="#17784e"/><rect x="507" y="231.07125" width="24" height="60.92875" fill="#17784e"/><rect x="541" y="216.5155" width="24" height="75.4845" fill="#17784e"/><rect x="575" y="210.45225" width="24" height="81.54775" fill="#17784e"/><rect x="609" y="211.262" width="24" height="80.738" fill="#17784e"/><rect x="643" y="204.60625" width="24" height="87.39375" fill="#17784e"/><rect x="677" y="150.17525" width="24" height="141.82475" fill="#17784e"/><rect x="711" y="185.7055" width="24" height="106.2945" fill="#17784e"/><rect x="745" y="155.725" width="24" height="136.275" fill="#f2cb24"/><text x="337" y="321" font-size="17" fill="#465366" font-weight="400" text-anchor="start">Jan 21</text><text x="553" y="321" font-size="17" fill="#465366" font-weight="400" text-anchor="middle">Jul 21</text><text x="769" y="321" font-size="17" fill="#f2cb24" font-weight="700" text-anchor="end">Jan 22</text><line x1="24" y1="350" x2="776" y2="350" stroke="#cad1db"/><text x="28" y="377" font-size="17" fill="#465366" font-weight="400" text-anchor="start">More transactions drove payment growth; the cause is not established.</text></g></svg>
