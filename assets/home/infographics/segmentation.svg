<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" role="img" aria-label="Investor churn by segment"><rect x="0" y="0" width="800" height="392" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="800" height="8" fill="#843e47"/><text x="28" y="44" font-size="25" fill="#843e47" font-weight="700" text-anchor="start">High-value users have the highest observed churn</text><text x="28" y="74" font-size="18" fill="#465366" font-weight="400" text-anchor="start">Churn rate within each investor segment</text><line x1="217" y1="99" x2="217" y2="294" stroke="#cad1db"/><text x="217" y="322" font-size="17" fill="#465366" font-weight="400" text-anchor="middle">0%</text><line x1="377" y1="99" x2="377" y2="294" stroke="#cad1db"/><text x="377" y="322" font-size="17" fill="#465366" font-weight="400" text-anchor="middle">20%</text><line x1="537" y1="99" x2="537" y2="294" stroke="#cad1db"/><text x="537" y="322" font-size="17" fill="#465366" font-weight="400" text-anchor="middle">40%</text><line x1="697" y1="99" x2="697" y2="294" stroke="#cad1db"/><text x="697" y="322" font-size="17" fill="#465366" font-weight="400" text-anchor="middle">60%</text><text x="28" y="128" font-size="20" fill="#17202b" font-weight="400" text-anchor="start">Newcomers</text><rect x="217" y="105" width="268.1915654038599" height="30" fill="#d9bfc4"/><text x="496.1915654038599" y="128" font-size="20" fill="#17202b" font-weight="700" text-anchor="start">33.5%</text><text x="28" y="176" font-size="20" fill="#17202b" font-weight="400" text-anchor="start">Beginners</text><rect x="217" y="153" width="316.31870472944183" height="30" fill="#d9bfc4"/><text x="544.3187047294418" y="176" font-size="20" fill="#17202b" font-weight="700" text-anchor="start">39.5%</text><text x="28" y="224" font-size="20" fill="#17202b" font-weight="400" text-anchor="start">Frequent users</text><rect x="217" y="201" width="359.60591133004925" height="30" fill="#d9bfc4"/><text x="587.6059113300493" y="2