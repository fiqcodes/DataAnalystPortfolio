<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" role="img" aria-label="Campaign sales comparison"><rect x="0" y="0" width="800" height="392" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="800" height="8" fill="#126b6d"/><text x="28" y="44" font-size="25" fill="#126b6d" font-weight="700" text-anchor="start">Promotion 1 leads. Is the difference meaningful?</text><text x="28" y="74" font-size="18" fill="#465366" font-weight="400" text-anchor="start">Average weekly sales per store, thousands</text><line x1="177" y1="98" x2="177" y2="274" stroke="#cad1db"/><text x="177" y="301" font-size="17" fill="#465366" font-weight="400" text-anchor="middle">0</text><line x1="347" y1="98" x2="347" y2="274" stroke="#cad1db"/><text x="347" y="301" font-size="17" fill="#465366" font-weight="400" text-anchor="middle">20</text><line x1="517" y1="98" x2="517" y2="274" stroke="#cad1db"/><text x="517" y="301" font-size="17" fill="#465366" font-weight="400" text-anchor="middle">40</text><line x1="687" y1="98" x2="687" y2="274" stroke="#cad1db"/><text x="687" y="301" font-size="17" fill="#465366" font-weight="400" text-anchor="middle">60</text><text x="28" y="133" font-size="20" fill="#17202b" font-weight="400" text-anchor="start">Promotion 1</text><rect x="177" y="106" width="493.84159883720935" height="36" fill="#bc2058"/><text x="681.8415988372094" y="133" font-size="23" fill="#17202b" font-weight="700" text-anchor="start">58.10</text><text x="28" y="192" font-size="20" fill="#17202b" font-weight="400" text-anchor="start">Promotion 3</text><rect x="177" y="165" width="470.5979787234043" height="36" fill="#80b6b3"/><text x="658.5979787234044" y="192" font-size="23" fill="#17202b" font-weight="700" text-anchor="start">55.36</text><text x="28" y="251" font-size="20" fill="#17202b" font-weight="400" text-anchor="start">Promotion 2</text><rect x="177" y="224" width="402.3000265957446" height="36" fill="#80b6b3"/><text x="590.3000265957446" y="251" font-size="23" fill="#17202b" font-weight="700" text-anchor="start">47.33</text><text x="28" y="333" font-size="19" fill="#126b6d" font-weight="700" text-anchor="start">No clear difference between 1 and 3 (store-level p = 0.426).</text><line x1="24" y1="350" x2="776" y2="350" stroke="#cad1db"/><text x="28" y="377" font-size="17" fill="#465366" font-weight="400" text-anchor="start">137 stores / 4 weeks. Averages do not adjust for market mix.</text></g></svg>
